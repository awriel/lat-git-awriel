<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - Kontak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 30px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 150px;
        }
        button {
            background-color: #0056b3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #004085;
        }
        .info-kontak {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .info-kontak p {
            margin: 8px 0;
        }
        a {
            color: #0056b3;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hubungi Kami</h1>
    <p style="text-align: center; color: #666;">Silakan isi formulir di bawah ini atau hubungi kami langsung.</p>
    
    <form action="#" method="POST">
        <div class="form-group">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" name="name" placeholder="Masukkan nama Anda" required>
        </div>
        
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Nomor Telepon</label>
            <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxxx">
        </div>
        
        <div class="form-group">
            <label for="message">Pesan</label>
            <textarea id="message" name="message" placeholder="Tuliskan pesan Anda di sini..." required></textarea>
        </div>
        
        <button type="submit">Kirim Pesan</button>
    </form>
    
    <div class="info-kontak">
        <h3>Informasi Kontak</h3>
        <p>Email: <a href="mailto:info@domainanda.com">info@domainanda.com</a></p>
        <p>Telepon: <a href="tel:+6281234567890">+62 812-3456-7890</a></p>
        <p>Alamat: Jl. Contoh No. 123, Central Java, Indonesia</p>
    </div>
</div>

</body>
</html>
