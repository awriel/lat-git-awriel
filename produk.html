<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online Sekolah - XI RPL</title>
    <style>
        /* =================================================== */
        /* CSS GABUNGAN (STYLING LANDING PAGE) */
        /* =================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Styling Navbar (Tugas Siswa A) */
        nav {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        nav h2 {
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        /* Styling Section Produk (Tugas Siswa B) */
        .produk-section {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: #1e293b;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: #3b82f6;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Grid Layout Kotak Produk */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Desain Kartu Produk */
        .product-card {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Tag Label (Hot/Diskon) */
        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ef4444;
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 20px;
            z-index: 10;
        }

        /* Wadah Gambar Produk */
        .product-image {
            height: 240px;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        /* Informasi Produk */
        .product-info {
            padding: 20px;
        }

        .product-info .category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
        }

        .product-info h3 {
            font-size: 1.1rem;
            color: #1e293b;
            margin: 8px 0;
            height: 44px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-info .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .product-info .old-price {
            font-size: 0.9rem;
            color: #94a3b8;
            text-decoration: line-through;
            font-weight: normal;
            margin-right: 5px;
        }

        /* Tombol Beli */
        .btn-buy {
            width: 100%;
            padding: 10px;
            background-color: #1e293b;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-buy:hover {
            background-color: #3b82f6;
        }
    </style>
</head>

<body>

    <!-- =================================================== -->
    <!-- NAVBAR UTAMA (TUGAS SISWA A) -->
    <!-- =================================================== -->
    <nav>
        <h2>Toko Online Merchandise SMK</h2>
    </nav>

    <main>
        <!-- =================================================== -->
        <!-- SECTION PRODUK (TUGAS SISWA B) -->
        <!-- =================================================== -->
        <section class="produk-section">
            <h2 class="section-title">Produk Unggulan Kreatif RPL</h2>

            <div class="product-grid">
                <!-- Kartu Produk 1 -->
                <div class="product-card">
                    <div class="product-badge">Hot</div>
                    <div class="product-image">
                        <img src="https://unsplash.com" alt="Kaos RPL">
                    </div>
                    <div class="product-info">
                        <span class="category">Merchandise</span>
                        <h3>Kaos Angkatan Rekayasa Perangkat Lunak</h3>
                        <p class="price">Rp 85.000</p>
                        <button class="btn-buy">Beli Sekarang</button>
                    </div>
                </div>

                <!-- Kartu Produk 2 -->
                <div class="product-card">
                    <div class="product-image">
                        <img src="https://unsplash.com" alt="Topi SMK">
                    </div>
                    <div class="product-info">
                        <span class="category">Aksesoris</span>
                        <h3>Topi Snapback Eksklusif SMK</h3>
                        <p class="price">Rp 45.000</p>
                        <button class="btn-buy">Beli Sekarang</button>
                    </div>
                </div>

                <!-- Kartu Produk 3 -->
                <div class="product-card">
                    <div class="product-badge">Diskon</div>
                    <div class="product-image">
                        <img src="https://unsplash.com" alt="Gantungan Kunci">
                    </div>
                    <div class="product-info">
                        <span class="category">Souvenir</span>
                        <h3>Gantungan Kunci Akrilik Logo RPL</h3>
                        <p class="price"><span class="old-price">Rp 15.000</span> Rp 10.000</p>
                        <button class="btn-buy">Beli Sekarang</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- =================================================== -->
        <!-- TEMPAT UNTUK KODINGAN KONTAK SISWA C NANTI -->
        <!-- =================================================== -->
    </main>

</body>

</html>
